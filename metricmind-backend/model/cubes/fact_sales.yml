cubes:
  - name: fact_sales

    sql_table: ANALYTICS.FACT_SALES
    
    joins:
      - name: dim_customers
        relationship: many_to_one
        sql: "{CUBE}.CUSTOMER_ID = {dim_customers}.CUSTOMER_ID"

      - name: dim_products
        relationship: many_to_one
        sql: "{CUBE}.PRODUCT_ID = {dim_products}.PRODUCT_ID"

      - name: dim_regions
        relationship: many_to_one
        sql: "{CUBE}.REGION_ID = {dim_regions}.REGION_ID"
        
    dimensions:
      - name: sale_id
        sql: SALE_ID
        type: number
        primary_key: true

      - name: customer_id
        sql: CUSTOMER_ID
        type: number

      - name: product_id
        sql: PRODUCT_ID
        type: number

      - name: region_id
        sql: REGION_ID
        type: number

      - name: sale_date
        sql: SALE_DATE
        type: time

    measures:
      - name: total_revenue
        sql: REVENUE
        type: sum

      - name: total_cost
        sql: COST
        type: sum

      - name: total_profit
        sql: "{CUBE}.REVENUE - {CUBE}.COST"
        type: sum

      - name: total_quantity
        sql: QUANTITY
        type: sum

      - name: total_orders
        type: count

      - name: profit_margin
        sql: "{total_profit} / NULLIF({total_revenue}, 0)"
        type: number
        format: percent